<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axiona Obra · del lote a la obra en 3D</title>
<meta name="description" content="Del lote al juego de planos completo, el modelo 3D amoblado, el presupuesto y la realidad aumentada, para Colombia, España y Canadá. Gratis y de código abierto.">
<meta name="theme-color" content="#080c11">
<meta property="og:title" content="Axiona Obra">
<meta property="og:description" content="Lote, juego de planos en PDF, 3D amoblado, presupuesto, trámites y recorrido en realidad aumentada. Colombia, España y Canadá. Gratis y de código abierto.">
<meta property="og:image" content="https://obra.axionasoft.com/compartir.jpg">
<meta property="og:url" content="https://obra.axionasoft.com">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icono-192.png">
<link rel="apple-touch-icon" href="./icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>Axiona Obra</h1><small id="nombreProyecto"></small></div></div>
      <div class="kpis" id="kpis"></div>
      <div class="acciones">
        <div class="seg" id="paisSeg" role="group"></div>
        <div class="seg" id="idiomaSeg" role="group"></div>
        <div class="seg" id="unidSeg" role="group"></div>
        <button class="btn sm" data-act="compartir" id="bCompartir"></button>
        <button class="btn sm pri" data-act="instalar" id="bInstalar" hidden></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="errbox"></div>
  <section id="tab-proyecto" class="split"></section>
  <section id="tab-terreno" class="split" hidden></section>
  <section id="tab-programa" class="split" hidden></section>

  <section id="tab-planos" class="split wide" hidden>
    <div class="card canvas-card">
      <div class="cv-bar vistas" id="planViews"></div>
      <div class="svgbox" id="planBox">
        <div class="zoom"><button class="btn" data-zoom="in" aria-label="+">+</button><button class="btn" data-zoom="out" aria-label="−">−</button><button class="btn" data-zoom="fit" aria-label="⤢">⤢</button></div>
      </div>
      <div class="legend" id="planLegend"></div>
    </div>
    <div class="split laminas">
      <div class="card" id="v-laminas"></div>
      <div class="card canvas-card">
        <div class="cv-bar" id="laminaBar"></div>
        <div class="svgbox lamina" id="laminaBox">
          <div class="zoom"><button class="btn" data-zoom="in" aria-label="+">+</button><button class="btn" data-zoom="out" aria-label="−">−</button><button class="btn" data-zoom="fit" aria-label="⤢">⤢</button></div>
        </div>
      </div>
    </div>
    <div class="split dos" id="v-replanteo"></div>
  </section>

  <section id="tab-interiores" class="split" hidden></section>

  <section id="tab-modelo" class="split wide" hidden>
    <div class="card canvas-card">
      <div class="cv-bar">
        <button class="chip" data-cat="negra" id="c3negra"></button><button class="chip" data-cat="gris" id="c3gris"></button><button class="chip" data-cat="blanca" id="c3blanca"></button><button class="chip" data-cat="dot" id="c3dot"></button>
        <span style="flex:1"></span>
        <span class="lbl" id="l3piso"></span><select id="floorSel" class="chip" style="padding-right:8px"></select>
        <button class="chip" id="techoBtn" aria-pressed="false"></button>
        <button class="chip" id="spinBtn" aria-pressed="false"></button>
        <button class="chip" data-act="foto" id="b3foto"></button>
        <button class="chip on-amb" data-act="recorrido" id="b3recorrido"></button>
      </div>
      <div class="three" id="threeBox"><div class="hud" id="hud"></div></div>
      <div class="phase"><input type="range" min="0" max="10" step="1" id="phaseRange" aria-label="Fase"></div>
      <div class="phases" id="phaseList"></div>
    </div>
  </section>

  <section id="tab-cantidades" class="split" hidden></section>
  <section id="tab-ventas" class="split" hidden></section>
  <section id="tab-ar" class="split wide" hidden></section>

  <p class="foot" id="foot"></p>
</main>

<div id="arOverlay" hidden><div class="ar-top" id="arMsg"></div><div class="ar-bot" id="arBtns"></div></div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
