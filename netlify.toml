# Axiona Obra: sitio estatico. Se publica dist ya compilado (npm run build).
[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), xr-spatial-tracking=(self), fullscreen=(self)"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# El service worker nunca se cachea: si no, una version nueva tardaria
# dias en llegar a los telefonos que ya tienen la app instalada.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
